<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
    <h1>My Note</h1>
  </header>
  <div class="container">
    <h1>My Notes</h1>

    <input id="noteTitle" placeholder="Title">
    <textarea id="noteContent" rows="4" placeholder="Content"></textarea>
    <button onclick="createNote()">Create Note</button>

    <h2>Your Notes</h2>
    <div id="notes"></div>

    <button style="margin-top:15px;background:#95a5a6;" onclick="logout()">Logout</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
